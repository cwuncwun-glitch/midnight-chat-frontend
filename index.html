<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midnight Chat</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        #chat-box { height: 300px; border: 1px solid #ccc; overflow-y: scroll; padding: 10px; margin-bottom: 10px; }
        .message { margin-bottom: 10px; }
        .user { color: blue; }
        .bot { color: green; }
        .error { color: red; }
        input[type="text"] { width: 80%; padding: 10px; }
        button { padding: 10px 15px; }
    </style>
</head>
<body>

    <h2>Midnight Chat</h2>
    <div id="chat-box"></div>

    <input type="text" id="user-input" placeholder="输入消息...">
    <button onclick="sendMessage()">发送</button>

    <script>
        // Render 后端 API 地址（已更新为 -4 后缀）
        const API_URL = 'https://midnight-chat-backend-6.onrender.com';

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const chatBox = document.getElementById('chat-box');
            const text = input.value.trim();

            if (!text) return;

            // 显示用户发送的消息
            chatBox.innerHTML += `<div class="message user"><b>你:</b> ${text}</div>`;
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                // 发送请求给 Render 后端
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });

                if (!response.ok) {
                    throw new Error(`HTTP 错误！状态码: ${response.status}`);
                }

                const data = await response.json();
                
                // 显示后端返回的消息（若没有 reply 字段则尝试读取 response/message）
                const botReply = data.reply || data.response || data.message || JSON.stringify(data);
                chatBox.innerHTML += `<div class="message bot"><b>机器人:</b> ${botReply}</div>`;

            } catch (error) {
                console.error('发送失败:', error);
                chatBox.innerHTML += `<div class="message error"><b>错误:</b> 无法连接后端服务器，请稍后重试。</div>`;
            }

            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>

</body>
</html>

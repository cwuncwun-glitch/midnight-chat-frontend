<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midnight Chat</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 30px auto; padding: 20px; }
        #chat-box { height: 30px; border: 1px solid #ccc; padding: 10px; overflow-y: scroll; margin-bottom: 10px; }
        .message { margin-bottom: 10px; }
        .user { color: blue; }
        .bot { color: green; }
        input[type="text"] { width: 80%; padding: 10px; }
        button { padding: 10px 15px; }
    </style>
</head>
<body>

    <h2>Midnight Chat</h2>
    <div id="chat-box"></div>

    <input type="text" id="user-input" placeholder="输入消息...">
    <button onclick="sendMessage()">发送</button>

    <script>
        // 您的 Render 后端 API 地址
        const API_URL = 'https://midnight-chat-backend-4.onrender.com/api/support';
        async function sendMessage() {
            const input = document.getElementById('user-input');
            const chatBox = document.getElementById('chat-box');
            const text = input.value.trim();

            if (!text) return;

            // 显示用户发送的消息
            chatBox.innerHTML += `<div class="message user"><b>您：</b> ${text}</div>`;
            input.value = '';

            try {
                // 发送请求给 Render 后端
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });

                const data = await response.json();
                
                // 显示后端/AI的回复
                const reply = data.reply || data.analysis || JSON.stringify(data);
                chatBox.innerHTML += `<div class="message bot"><b>机器人：</b> ${reply}</div>`;
            } catch (error) {
                chatBox.innerHTML += `<div class="message bot" style="color:red;"><b>错误：</b> 无法连接后端服务器</div>`;
                console.error(error);
            }

            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>

</body>
</html>
